[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "kardinal-ai"
version = "1.0.0"
description = "Kardinal Python SDK: route optimization plans and solutions."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kardinal" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.urls]
Documentation = "https://developers.kardinal.ai"
Source = "https://github.com/KardinalAI/kardinal-sdk-python"
Issues = "https://github.com/KardinalAI/kardinal-sdk-python/issues"

[project.optional-dependencies]
# typer 0.19 and click 8.2 are the oldest versions the CLI tests pass on
# (click 8.2: no arguments at all is a usage error, exit code 2).
cli = ["typer>=0.19", "click>=8.2"]
dev = [
    "typer>=0.19",
    "click>=8.2",
    # Pinned exactly, not >=: different datamodel-code-generator versions
    # decide differently which models need an explicit model_rebuild() call,
    # so an unpinned version here made the CI "models regenerate with no
    # diff" check (tests/test_models_no_diff.py) fail nondeterministically depending
    # on which version pip happened to resolve on a given run.
    "datamodel-code-generator==0.45.0",
    # Pinned exactly, like the code generator: a new mypy release can report
    # new errors on unchanged code and fail CI on its own.
    "mypy==2.3.1",
    "pytest>=8.0",
    # scripts/check_spec_matches_mintlify.sh parses both specs.
    "pyyaml>=6.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[project.scripts]
kardinal = "kardinal.cli:app"

# PEP 561: without this marker in the wheel, a user's mypy or pyright skips
# the package entirely — every annotation here is invisible to them, and a
# misspelled attribute or a wrong argument type is reported nowhere.
[tool.setuptools.package-data]
kardinal = ["py.typed"]

[tool.setuptools.packages.find]
include = ["kardinal*"]

[tool.mypy]
plugins = ["pydantic.mypy"]
files = ["kardinal"]

# Generated from spec/openapi.yaml: never hand-edited, so not type-checked.
[[tool.mypy.overrides]]
module = "kardinal.routing.models"
ignore_errors = true
