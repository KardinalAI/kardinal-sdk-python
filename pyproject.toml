[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "kardinal-ai"
version = "1.0.0"
description = "Kardinal Python SDK: route optimization plans and solutions."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kardinal" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.urls]
Documentation = "https://developers.kardinal.ai"
Source = "https://github.com/KardinalAI/kardinal-sdk-python"
Issues = "https://github.com/KardinalAI/kardinal-sdk-python/issues"

[project.optional-dependencies]
cli = ["typer>=0.12"]
dev = [
    "typer>=0.12",
    # Pinned exactly, not >=: different datamodel-code-generator versions
    # decide differently which models need an explicit model_rebuild() call,
    # so an unpinned version here made the CI "models regenerate with no
    # diff" check (tests/test_models_no_diff.py) fail nondeterministically depending
    # on which version pip happened to resolve on a given run.
    "datamodel-code-generator==0.45.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[project.scripts]
kardinal = "kardinal.cli:app"

[tool.setuptools.packages.find]
include = ["kardinal*"]
