# Publishes kardinal-ai to PyPI with Trusted Publishing (no stored token).
#
# - A tag vX.Y.Z publishes to PyPI. Tags are created on the source
#   repository and reach this one through a push mirror.
# - "Run workflow" (workflow_dispatch) publishes a dry run to TestPyPI, as
#   X.Y.Z.devN (N = run number): TestPyPI never accepts a version twice.
#
# Each publish job runs in a GitHub environment that requires a reviewer's
# approval, so nothing is published without a human go-ahead.
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]" build==1.6.1 twine==7.0.0
      - name: Test
        run: pytest -q
      - name: Check the tag matches the package version
        if: github.ref_type == 'tag'
        run: python scripts/check_tag_matches_version.py "$GITHUB_REF_NAME"
      - name: Use a unique X.Y.Z.devN version for a TestPyPI dry run
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/set_dev_version.py "$GITHUB_RUN_NUMBER"
      - name: Build
        run: python -m build
      - name: Check the distributions
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    # A real tag push only: a manual run started on a tag must not reach PyPI.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kardinal-ai/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/kardinal-ai/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
